name: Labeler

# Auto-labels PRs by the paths they touch (config in .github/labeler.yml).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    # pull_request_target is safe here: the job reads the base branch config and never checks out PR code.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
